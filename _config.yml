title: "Peng Tan"
name: "Peng Tan"
email: "tanpnudt@hotmail.com"
description: "Peng Tan — machine learning, data mining, and the learnware paradigm."
url: "https://tanp-nudt.github.io"
baseurl: ""
repository: "tanp-nudt/tanp-nudt.github.io"
locale: "en-US"
minimal_mistakes_skin: "default"
search: false
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
timezone: Asia/Shanghai
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - _posts
  - _pages/category-archive.md
  - _pages/tag-archive.md
  - _pages/year-archive.md
  - vendor
plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
author:
  name: "Peng Tan"
  avatar: "/assets/images/portrait-2026.jpg"
  bio: "Postdoctoral Researcher<br>Deya Young Scholar<br>College of Science, NUDT"
  location: "Changsha, China"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:tanpnudt@hotmail.com"
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/tanp-nudt"
atom_feed:
  hide: true
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
